# XcodeGen spec. On the Mac:
#   brew install xcodegen
#   cd DotBloom && xcodegen generate && open DotBloom.xcodeproj
# Re-run `xcodegen generate` after adding or removing files.

name: DotBloom
options:
  bundleIdPrefix: com.example          # replace with your reverse domain before TestFlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""               # set your team ID, or pick it in Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"      # iPhone and iPad
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DotBloom:
    type: application
    platform: iOS
    sources:
      - path: DotBloom
    info:
      path: DotBloom/Info.plist
      properties:
        CFBundleDisplayName: DotBloom
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DotBloom
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ENABLE_PREVIEWS: true

  DotBloomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DotBloomTests
    dependencies:
      - target: DotBloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DotBloomTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  DotBloom:
    build:
      targets:
        DotBloom: all
        DotBloomTests: [test]
    test:
      targets:
        - DotBloomTests
